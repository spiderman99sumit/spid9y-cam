name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
  android-and-windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        shell: pwsh
        run: '& "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0"'
      - name: Parse Windows scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "Syntax error in $($_.Name): $errors" }
          }
      - name: Build development APK
        shell: pwsh
        run: ./android/Build-Apk.ps1
      - name: Check Python syntax
        run: python -m py_compile webcam-output.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Spid9y-Cam-development-build
          path: android/build/Spid9y-Cam-Development.apk
